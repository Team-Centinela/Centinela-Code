spring:
  application:
    name: centinela-core-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:centinela}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      schema: public

  flyway:
    enabled: true
    schemas: cases,alerts,reporting,auth,rules_config,outbox
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  cloud:
    stream:
      bindings:
        transactionsRaw-in-0:
          destination: transactions-raw
          group: core-backend
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
        processor:
          auto-startup: false

server:
  port: 8080

outbox:
  publisher:
    interval-ms: 1000
    batch-size: 100
    max-attempts: 10
    stale-threshold-minutes: 5

logging:
  level:
    com.centinela: DEBUG
