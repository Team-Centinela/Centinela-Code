spring:
  application:
    name: centinela-ingestion

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/centinela}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      schema: oltp

  flyway:
    enabled: true
    schemas: oltp,outbox,auth
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: oltp

  cloud:
    stream:
      bindings:
        fraud-evaluation-out-0:
          destination: fraud-evaluation
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
        processor:
          auto-startup: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081

logging:
  level:
    com.centinela: DEBUG

outbox:
  publisher:
    interval-ms: 1000
    batch-size: 100
    max-attempts: 10
    stale-threshold-minutes: 5
    drain-timeout-ms: 10000

applicationinsights:
  connection-string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}
