spring:
  config:
    activate:
      on-profile: azure

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:centinela}
    username: ${DB_USERNAME:centinela}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

azure:
  storage:
    blob:
      container-name: documentos-verificacion
  keyvault:
    vault-url: ${KEYVAULT_URL:}

centinela:
  scoring:
    threshold: ${SCORING_THRESHOLD:60}
  servicebus:
    namespace: ${SERVICEBUS_NAMESPACE:}
    queue:
      ingestion: transacciones-ingestion
    topic:
      cases: casos-fraude
    subscription:
      gestion: gestion-casos
  rules:
    velocity:
      window-minutes: 5
      max-transactions: 3
      points: 35
    amount:
      multiplier-threshold: 10
      points: 30
    geo:
      max-distance-km: 1000
      min-time-minutes: 60
      points: 25
    merchant:
      points: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.centinela: INFO
