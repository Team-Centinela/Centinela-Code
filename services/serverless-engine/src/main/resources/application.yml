spring:
  application:
    name: centinela-serverless-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/centinela}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    schemas: rules_config,received_messages,triggered_rules
    create-schemas: true
    locations: classpath:db/migration/common,classpath:db/migration/pg
    baseline-on-migrate: true
    placeholders:
      uuid-func: gen_random_uuid

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: rules_config

  cloud:
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
        processor:
          auto-startup: false

server:
  port: 8082

logging:
  level:
    com.centinela: DEBUG

applicationinsights:
  connection-string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}
