version: '3.8'

services:
  backend:
    build:
      context: ./centinela-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_NAME=centinela_db
      - DB_USERNAME=centinela
      - DB_PASSWORD=centinela
    depends_on:
      - postgres
      - redis
    networks:
      - centinela-net

  frontend:
    build:
      context: ./centinela-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - centinela-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=centinela_db
      - POSTGRES_USER=centinela
      - POSTGRES_PASSWORD=centinela
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - centinela-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - centinela-net

volumes:
  postgres-data:

networks:
  centinela-net:
    driver: bridge
