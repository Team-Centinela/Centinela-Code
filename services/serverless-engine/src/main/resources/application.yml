spring:
  application:
    name: centinela-serverless-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/centinela}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    schemas: oltp,outbox,auth
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: oltp

  cloud:
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
        processor:
          auto-startup: false
    stream:
      bindings:
        transactionsRaw-in-0:
          destination: transactions-raw
          group: serverless-engine
        case-events-out-0:
          destination: case-events

server:
  port: 8082

logging:
  level:
    com.centinela: DEBUG

outbox:
  publisher:
    interval-ms: 1000
    batch-size: 100
    max-attempts: 10
    stale-threshold-minutes: 5
    drain-timeout-ms: 10000

fraud:
  rule:
    score-threshold: ${FRAUD_SCORE_THRESHOLD:60.0}
    score-max: 100.0
    fr1:
      window-seconds: 600
      velocity-threshold: 5
    fr2:
      z-threshold: 2.5
    fr3:
      max-km-per-hour: 900.0
    fr4:
      hard-flag-score: 80.0

applicationinsights:
  connection-string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:}

management:
  tracing:
    sampling:
      probability: 1.0
