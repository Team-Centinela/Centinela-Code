version: "3.9"

# Local development only — never use this file or these credentials in production.
# Secrets (credentials, connection strings) must come from Azure Key Vault in any non-dev environment.
# Flyway migrations handle all schema management at application startup.

services:
  postgres:
    image: postgres:16-alpine
    container_name: centinela-db
    environment:
      POSTGRES_DB: centinela
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
