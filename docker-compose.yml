version: '3.8'

services:
  backend:
    build:
      context: ./centinela-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - centinela-net

  frontend:
    build:
      context: ./centinela-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - centinela-net

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=centinela_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - centinela-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - centinela-net

volumes:
  mysql-data:

networks:
  centinela-net:
    driver: bridge
